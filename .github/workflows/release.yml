name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld zip
      - run: python3 -m unittest discover -s tests -v
      - run: ./native/check.sh
        env:
          HOST_CC: gcc
      - name: Build package
        env:
          CLANG: clang
          LLD: ld.lld
        run: ./package.sh
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: build/mst2-zr-nar-carplay-maps-p0367t.zip

